name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o drydock .

      - name: Simulate the bundled capture
        run: |
          ./drydock --from examples/capture.json
          ./drydock --from examples/capture.json -o json > out.json
          grep -q '"pending": 5' out.json
          grep -q '"scheduled": 3' out.json
          grep -q '"unschedulable": 2' out.json
          ./drydock --from examples/capture.json -o csv > out.csv
          grep -q 'default,batch,2000,4294967296,0,cpu-a' out.csv
          ./drydock --from examples/capture.json --namespace ml | grep -q '3 pending pods'

      - name: Check the HTML report
        run: |
          ./drydock --from examples/capture.json -o html > report.html
          grep -q '<!DOCTYPE html>' report.html
          grep -q 'Scheduler simulation' report.html
          grep -q 'gpu-b' report.html
          # The report must work offline: no scripts, no external requests.
          ! grep -q '<script' report.html
          ! grep -qE '(<link|<img|src="http)' report.html

      - name: Version
        run: ./drydock version
